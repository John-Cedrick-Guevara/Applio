# Runs the same gate every commit must pass locally (CLAUDE.md §5): typecheck,
# lint and tests, plus the production build once the project has one.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci
        env:
          # Tests and the build don't launch Electron; skip its ~100 MB binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck, lint, test
        run: npm run check

      - name: Build
        run: npm run build --if-present
